<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <match target="font">
    <edit name="autohint" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>
    <edit mode="assign" name="hintstyle">
      <const>hintslight</const>
    </edit>
    <edit mode="assign" name="lcdfilter">
     <const>lcddefault</const>
   </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>sans</string></test>
    <edit name="family" mode="assign" binding="strong"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>ui-sans-serif</string></test>
    <edit name="family" mode="assign" binding="strong"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>system-ui</string></test>
    <edit name="family" mode="assign" binding="strong"><string>sans-serif</string></edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="same"><string>Fira Sans</string></edit>
    <edit name="family" mode="prepend" binding="same"><string>Noto Color Emoji</string></edit>
    <edit name="family" mode="prepend" binding="same"><string>VL Gothic</string></edit>
    <edit name="family" mode="prepend" binding="same"><string>aquafont</string></edit>
    <edit name="family" mode="prepend" binding="same"><string>IPAexGothic</string></edit>
    <edit name="family" mode="prepend" binding="same"><string>FreeSans</string></edit>

  <!--
    <edit name="family" mode="prepend" binding="same"><string>Noto Sans Mono CJK HK</string></edit>
  -->
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="same"><string>Shippori Mincho OTF</string></edit>
    <edit name="family" mode="prepend" binding="same"><string>IPAexMincho</string></edit>
    <edit name="family" mode="prepend" binding="same"><string>FreeSerif</string></edit>
    <edit name="family" mode="prepend" binding="same"><string>Noto Serif Mono CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="same"><string>FreeMono</string></edit>
    <edit name="family" mode="prepend" binding="same"><string>VL Gothic</string></edit>
    <edit name="family" mode="prepend" binding="same"><string>aquafont</string></edit>
    <edit name="family" mode="prepend" binding="same"><string>Fira Mono</string></edit>
    <edit name="family" mode="prepend" binding="same"><string>Noto Sans Mono CJK JP</string></edit>
  </match>
</fontconfig>
