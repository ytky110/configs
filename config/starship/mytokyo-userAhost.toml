format = """
[ 󰣇 ](fg:#090c0c bg:#a3aed2)\
[](fg:#a3aed2 bg:#5d8aa8)\
$username\
$hostname\
[](fg:#5d8aa8 bg:#769ff0)\
$directory\
[](fg:#769ff0 bg:#394260)\
$git_branch\
$git_status\
[](fg:#394260 bg:#212736)\
$nodejs\
$rust\
$golang\
$php\
[](fg:#212736 bg:#1d2230)\
$time\
[ ](fg:#1d2230)\
\n$character"""

# Inserts a blank line between shell prompts
add_newline = false

[username]
show_always = true
style_user = "bg:#5d8aa8 fg:#ffffff"
#style_root = "bg:#5d8aa8 fg:#ffff00"
format = "[ $user]($style)"

[hostname]
ssh_only = false
style = "bg:#5d8aa8 fg:#ffffff"
format = "[@$hostname ]($style)"

[directory]
style = "fg:#e3e5e5 bg:#769ff0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $branch ](fg:#769ff0 bg:#394260)]($style)'

[git_status]
style = "bg:#394260"
format = '[[($all_status$ahead_behind )](fg:#769ff0 bg:#394260)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#1d2230"
format = '[[  $time ](fg:#a0a9cb bg:#1d2230)]($style)'
